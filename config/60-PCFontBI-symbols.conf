<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Append the complete pixel symbol companion only for this family. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>PCFontBI</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>PCFontBI Symbols</string>
    </edit>
  </match>
</fontconfig>
